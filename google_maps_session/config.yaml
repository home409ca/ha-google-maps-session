name: Google Maps Session
version: "0.1.3"
slug: google_maps_session
description: Logowanie Google z panelu HA i synchronizacja sesji Google Maps
arch: [amd64, aarch64]
stage: experimental
homeassistant: "2026.7.0"
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:google-maps
panel_title: Sesja Google Maps
panel_admin: true
homeassistant_api: true
map:
  - type: share
    read_only: false
  - type: homeassistant_config
    read_only: false
options:
  email: ""
  sync_interval: 300
  refresh_minutes: 30
schema:
  email: str
  sync_interval: int(300,86400)
  refresh_minutes: int(0,1440)
backup: cold
